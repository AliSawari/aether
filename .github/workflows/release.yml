name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-linux:
    name: Build and publish Linux (x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libgtk-3-dev \
            patchelf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri bundles (deb + AppImage)
        run: npm run tauri build -- --bundles deb,appimage

      - name: Generate release summary
        id: summary
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)
          VERSION="${TAG#v}"

          {
            echo "## What's Changed"
            echo ""
            if [ -f CHANGELOG.md ] && awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md | grep -q .; then
              awk -v ver="$VERSION" '
                $0 ~ "^## \\[" ver "\\]" { found=1; next }
                found && /^## \[/ { exit }
                found { print }
              ' CHANGELOG.md
            elif [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..${TAG}" --pretty=format:"- %s (%h)" --no-merges
            else
              git log --pretty=format:"- %s (%h)" --no-merges
            fi
            echo ""
            echo ""
            echo "## Downloads (Linux x86_64)"
            echo ""
            echo "| Format | Install / run |"
            echo "|--------|----------------|"
            echo "| \`.deb\` | \`sudo dpkg -i Aether_*.deb\` |"
            echo "| AppImage | \`chmod +x Aether_*.AppImage && ./Aether_*.AppImage\` |"
            echo ""
            echo "## License"
            echo ""
            echo "MIT — see [LICENSE](https://github.com/${{ github.repository }}/blob/${TAG}/LICENSE)"
          } > RELEASE_SUMMARY.md

          echo "path=RELEASE_SUMMARY.md" >> "$GITHUB_OUTPUT"

      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          EXISTING_BODY=$(gh release view "$TAG" --json body --jq '.body // ""')
          {
            if [ -n "$EXISTING_BODY" ]; then
              printf '%s\n\n' "$EXISTING_BODY"
            fi
            cat RELEASE_SUMMARY.md
          } > RELEASE_NOTES.md

          gh release edit "$TAG" --notes-file RELEASE_NOTES.md

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            --clobber
