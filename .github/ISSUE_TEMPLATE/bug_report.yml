name: Bug report
description: Report something that isn't working
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Aether version
      placeholder: e.g. 0.1.0 or commit hash
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install Aether?
      options:
        - .deb package
        - AppImage
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / distro
      placeholder: e.g. Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or errors
      description: Terminal output, toast messages, or `wg show` if applicable.
      render: shell
