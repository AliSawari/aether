[package]
name = "aether"
version = "0.1.0"
description = "WireGuard VPN manager for Linux"
authors = ["Ali Sawari"]
license = "MIT"
repository = "https://github.com/AliSawari/aether"
homepage = "https://github.com/AliSawari/aether"
edition = "2021"
rust-version = "1.88"
readme = "../README.md"
keywords = ["wireguard", "vpn", "tauri", "linux"]
categories = ["network-programming"]

[lib]
name = "aether_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros"] }
dirs = "6"
thiserror = "2"
regex = "1"
